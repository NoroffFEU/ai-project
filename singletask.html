<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <link rel="icon" href="" />
    <title>Open A.I | Daily Planner</title>
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/scss/styles.css" />
    <link rel="stylesheet" href="/dist/css/weekView.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script
      src="/js/weeklyView/utils/fileSaver.js"
      type="module"
      defer
    ></script>

    <script type="module" src="/js/index.js"></script>
    <script
      src="https://kit.fontawesome.com/6fb668811a.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/ui/renderSidebar.mjs" defer type="module"></script>
    <script src="/js/utils/toggleSidebar.mjs" defer type="module"></script>
  </head>
  <body>
    <header id="sidebarNav" class="sidebarNav"></header>

    <main>
      <div class="container d-flex flex-column align-items-center my-4">
        <img class="my-2" src="" alt="logo" />
        <p>Login to use all features of the app</p>
        <p>
          <a href="/login.html" class="text-decoration-none">Login</a>
          |
          <a href="/register.html" class="text-decoration-none">Register</a>
        </p>
      </div>

      <div class="container d-flex flex-column pb-5">
        <h1 class="fw-bold text-center">Task details</h1>
        <div id="singleTaskContainer" class="mt-5"></div>

        <div class="dropdown mx-auto mt-5">
          <button
            id="exportBtn"
            class="btn btn-outline-dark px-4 dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="fa-solid fa-download"></i> Export list as
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" id="exportPng">.PNG</a></li>
            <li><a class="dropdown-item" href="#" id="exportPdf">.PDF</a></li>
            <li><a class="dropdown-item" href="#" id="exportCsv">.CSV</a></li>
          </ul>
        </div>
      </div>

      <!-- Delete confirm modal -->
      <div
        class="modal fade"
        id="confirmModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="confirmTitle">Confirm</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body" id="confirmBody">Are you sure?</div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
                id="confirmCancelBtn"
              >
                Cancel
              </button>
              <button type="button" class="btn btn-danger" id="confirmOkBtn">
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="feedbackModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-sm modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-body text-center" id="feedbackBody">Utført</div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footerWrapper d-flex flex-column align-items-center pb-5">
        <div>
          <a href="/about.html" style="text-decoration: none">About</a>
          <a href="/faq.html" style="text-decoration: none">How to use</a>
        </div>
      </div>
      <div class="copyright d-flex justify-content-center pb-2">
        Copyright AIMOT &copy;
      </div>
    </footer>
  </body>
</html>
