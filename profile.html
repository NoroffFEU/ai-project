<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <link rel="icon" href="" />
    <title>Open A.I | Profile</title>
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./dist/css/styles.css" />
    <script type="module" src="./js/index.js"></script>
    <script
      src="https://kit.fontawesome.com/6fb668811a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header id="sidebarNav" class="sidebarNav"></header>
    <main class="profile-container">
      <img
        src="/assets/logo/LogoBlack.svg"
        class="profile-logo"
        alt="Black AIMOT brand logo"
      />
      <section class="profile-card">
        <h1>Profile</h1>
        <h2>Username</h2>
        <div class="profile-actions">
          <button type="button" class="btn-profile btn-signout">
            Sign Out
          </button>
          <button type="button" class="btn-profile btn-delete">
            Delete Account
          </button>
        </div>
      </section>
      <section class="login-redirect">
        <p>
          Not logged in yet? <br />
          <a href="./login.html">Log in here!</a>
        </p>
      </section>
    </main>
    <footer id="footer-container" class="footer"></footer>
  </body>
</html>
