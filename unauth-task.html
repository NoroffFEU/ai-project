<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create task | Demo</title>

    <link rel="icon" href="/assets/favicon/iconBlack.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/scss/styles.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body class="bg-dark bg-opacity-50">
    <main
      class="d-flex align-items-center justify-content-center min-vh-100 p-3"
    >
      <div class="bg-white rounded shadow p-4 w-100" style="max-width: 500px">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h5 mb-0">Create new task</h1>
          <a href="/" class="btn-close"></a>
        </div>

        <!-- ✅ Clear login prompt -->
        <div class="alert alert-info small mb-3">
          You’re viewing a demo.
          <strong>Log in or sign up</strong> to create and manage tasks.
        </div>

        <form>
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              disabled
              data-bs-toggle="modal"
              data-bs-target="#loginRequiredModal"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
              class="form-control"
              rows="3"
              disabled
              data-bs-toggle="modal"
              data-bs-target="#loginRequiredModal"
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">End date</label>
            <input
              type="date"
              class="form-control"
              disabled
              data-bs-toggle="modal"
              data-bs-target="#loginRequiredModal"
            />
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Color</label>
            <div
              class="d-flex gap-2"
              data-bs-toggle="modal"
              data-bs-target="#loginRequiredModal"
              style="cursor: pointer"
            >
              <button class="btn btn-outline-danger" disabled>Red</button>
              <button class="btn btn-outline-success" disabled>Green</button>
              <button class="btn btn-outline-primary" disabled>Blue</button>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-dark w-100"
            data-bs-toggle="modal"
            data-bs-target="#loginRequiredModal"
          >
            Create task
          </button>
        </form>
      </div>
    </main>

    <!-- ✅ Login required modal -->
    <div
      class="modal fade"
      id="loginRequiredModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-warning-subtle">
            <h5 class="modal-title">Login required</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            Please log in or create an account to start creating tasks.
          </div>
          <div class="modal-footer">
            <a href="/login.html" class="btn btn-primary">Log in</a>
            <a href="/register.html" class="btn btn-outline-primary">
              Sign up
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
