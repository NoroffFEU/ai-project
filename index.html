<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />

    <!--  generic favicon -->
    <link rel="icon" href="./assets/favicon/iconBlack.svg" />

    <title>Open A.I | Daily Planner</title>
   <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./scss/styles.css" />
    <script type="module" src="./js/index.js"></script>
    <script
      src="https://kit.fontawesome.com/6fb668811a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header id="sidebarNav" class="sidebarNav"></header>

    <main>
      <div class="container d-flex flex-column align-items-center my-4">
        <img id="app-logo" class="my-2" src="/assets/logo/LogoBlack.svg" alt="logo" />
        <p>Login to use all features of the app</p>
        <p>
          <a href="./login.html" class="text-decoration-none">Login</a>
          |
          <a href="./register.html" class="text-decoration-none">Register</a>
        </p>
      </div>

      <div id="task-board-module" class="container d-flex flex-column">
        <h1 class="fw-bold text-center">Task board</h1>
        <div class="d-flex justify-content-between align-items-center my-4">
          <p class="flex-fill">
            <span id="completed-tasks">0</span> /
            <span id="total-tasks">0</span>
            <i class="fa-solid fa-check"></i>
          </p>
          <button
            type="button"
            id="addTaskButton"
            class="btn btn-outline-dark px-4"
          >
            <i class="fa-solid fa-plus"></i> Add task
          </button>
        </div>
        <ul id="task-board-container" class="list-group"></ul>
        <div class="d-flex justify-content-end my-4">
          <button
            type="button"
            id="export-list-button"
            class="btn btn-outline-dark px-4"
          >
            <i class="fa-solid fa-download"></i> Export list
          </button>
        </div>
      </div>
    </main>
    <footer id="footer-container" class="footer"></footer>
  </body>
</html>
